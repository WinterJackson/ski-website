<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#18202c"/>
      <stop offset="100%" stop-color="#0a0e16"/>
    </linearGradient>

    <!-- Symbol Gradient (Electric Cyan to Vibrant Azure) -->
    <linearGradient id="symGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#0072ff"/>
    </linearGradient>

    <!-- Outer Squircle Glow -->
    <filter id="squircleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#0070f3" flood-opacity="0.35"/>
    </filter>

    <!-- Inner Symbol Glow -->
    <filter id="symbolGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Squircle Base with Shadow & Border -->
  <rect x="32" y="32" width="448" height="448" rx="100" ry="100"
        fill="url(#bgGrad)"
        stroke="#3ea6ff"
        stroke-width="4"
        stroke-opacity="0.45"
        filter="url(#squircleGlow)"/>

  <!-- Fast Forward / Skip Symbol (Grouped with Glow) -->
  <g filter="url(#symbolGlow)">
    <!-- First Triangle -->
    <path d="M 136 148 L 246 256 L 136 364 Z"
          fill="url(#symGrad)"
          stroke="url(#symGrad)"
          stroke-width="6"
          stroke-linejoin="round"/>

    <!-- Second Triangle -->
    <path d="M 238 148 L 348 256 L 238 364 Z"
          fill="url(#symGrad)"
          stroke="url(#symGrad)"
          stroke-width="6"
          stroke-linejoin="round"/>

    <!-- Vertical Stop Bar -->
    <rect x="352" y="148" width="36" height="216" rx="10" ry="10"
          fill="url(#symGrad)"/>
  </g>
</svg>

